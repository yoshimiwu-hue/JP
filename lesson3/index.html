<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第三課形容詞｜初級日語單字與否定變化練習卡</title>
  <script src="https://tailwindcss.com"></script>
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Inter:wght@600;700;800&family=Noto+Sans+JP:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans TC', 'Noto Sans JP', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #ffffff;
      color: #111827;
    }
    .jp-text {
      font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
    }
    .perspective-1000 {
      perspective: 1200px;
    }
    .flip-card-inner {
      display: grid;
      position: relative;
      width: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flip-card-face {
      grid-area: 1 / 1;
      width: 100%;
      min-height: 360px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
    .hide-furigana rt {
      opacity: 0;
      visibility: hidden;
    }
    ruby rt {
      font-size: 0.52em;
      color: #475569;
      font-weight: 700;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-amber-200/60">
  <div class="max-w-6xl mx-auto px-4 py-4 relative">
    <!-- Top Header -->
    <header class="bg-white rounded-2xl border-4 border-[#111827] px-5 py-3.5 mb-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
      <div class="flex items-center justify-center lg:justify-start gap-3 flex-wrap">
        <a href="../index.html" class="h-10 inline-flex items-center gap-1.5 px-3.5 rounded-xl text-sm font-black bg-[#111827] text-white hover:bg-gray-800 transition">
          ← 回課程目錄
        </a>
        <span class="inline-flex items-center h-9 px-3 rounded-lg text-sm font-black bg-[#D9381E] text-white">第 3 課</span>
        <h1 class="text-2xl sm:text-3xl font-black text-[#111827] tracking-tight">形容詞（い形容詞＆な形容詞）</h1>
      </div>
      <div class="flex items-center justify-center lg:justify-end gap-2.5 flex-wrap">
        <button id="toggle-furigana-btn" type="button" class="h-10 inline-flex items-center gap-2 px-4 rounded-xl text-sm font-black border-2 border-[#111827] bg-white text-[#111827] hover:bg-gray-100 transition">
          <span id="furigana-indicator" class="w-3 h-3 rounded-full bg-[#16A34A]"></span>
          <span>顯示假名</span>
        </button>
        <div class="h-10 inline-flex items-center gap-1.5 px-4 rounded-xl text-sm font-black bg-white border-2 border-[#111827] text-[#111827]">
          <span>已記熟</span>
          <span id="mastered-count" class="text-[#D9381E] text-base">0</span>
          <span class="text-gray-500" id="total-count-label">/ 28</span>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="grid grid-cols-3 gap-2.5 p-2 bg-white border-4 border-[#111827] rounded-2xl mb-4" role="tablist">
      <button type="button" data-tab="flashcards" class="tab-btn h-12 px-3 rounded-xl text-base sm:text-lg font-black transition bg-[#111827] text-white">
        單字翻轉卡
      </button>
      <button type="button" data-tab="antonyms" class="tab-btn h-12 px-3 rounded-xl text-base sm:text-lg font-black transition text-[#111827] hover:bg-gray-100">
        反義詞對照
      </button>
      <button type="button" data-tab="quiz" class="tab-btn h-12 px-3 rounded-xl text-base sm:text-lg font-black transition text-[#111827] hover:bg-gray-100">
        否定變形練習
      </button>
    </nav>

    <!-- TAB 1: FLASHCARDS -->
    <section id="tab-flashcards" class="tab-panel space-y-4">
      <!-- Filter & Actions -->
      <div class="flex flex-wrap items-center justify-between gap-2.5">
        <div class="flex flex-wrap items-center gap-2" id="card-filters">
          <button type="button" data-filter="all" class="filter-btn h-11 px-4 rounded-xl text-sm sm:text-base font-black bg-[#111827] text-white border-2 border-[#111827] transition">全部 (28)</button>
          <button type="button" data-filter="i" class="filter-btn h-11 px-4 rounded-xl text-sm sm:text-base font-black bg-white text-[#111827] border-2 border-[#111827] hover:bg-gray-100 transition">い形容詞 (20)</button>
          <button type="button" data-filter="na" class="filter-btn h-11 px-4 rounded-xl text-sm sm:text-base font-black bg-white text-[#111827] border-2 border-[#111827] hover:bg-gray-100 transition">な形容詞 (8)</button>
          <button type="button" data-filter="review" class="filter-btn h-11 px-4 rounded-xl text-sm sm:text-base font-black bg-white text-[#111827] border-2 border-[#111827] hover:bg-gray-100 transition">待複習 (<span id="review-filter-count">0</span>)</button>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button id="mark-review-btn" type="button" class="h-11 px-4 rounded-xl bg-white border-2 border-[#F97316] text-[#F97316] text-sm sm:text-base font-black hover:bg-orange-50 transition">↺ 需要再練</button>
          <button id="mark-mastered-btn" type="button" class="h-11 px-4 rounded-xl bg-[#16A34A] border-2 border-[#111827] text-white text-sm sm:text-base font-black hover:bg-[#15803D] transition">✓ 已記熟</button>
          <button id="shuffle-btn" type="button" class="h-11 px-4 rounded-xl text-sm sm:text-base font-black bg-white text-[#111827] border-2 border-[#111827] hover:bg-gray-100 transition">🔀 隨機洗牌</button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="space-y-1.5">
        <div class="flex justify-between text-sm font-bold text-gray-700">
          <span id="card-position-text">第 1 / 28 張</span>
          <span>點擊卡片翻面（或按空白鍵）</span>
        </div>
        <div class="w-full h-4 bg-white border-2 border-[#111827] rounded-full overflow-hidden">
          <div id="card-progress-bar" class="h-full bg-[#D9381E] transition-all duration-300" style="width: 3.5%"></div>
        </div>
      </div>

      <!-- Empty State -->
      <div id="flashcard-empty" class="hidden bg-white rounded-2xl border-4 border-[#111827] p-10 text-center space-y-4">
        <div class="text-4xl">🎉</div>
        <p class="text-xl font-black text-gray-900">目前沒有標記「待複習」的單字！</p>
        <p class="text-base text-gray-600">練習時點擊「需要再練」即可加入待複習清單。</p>
        <button id="reset-filter-btn" type="button" class="h-12 px-6 rounded-xl bg-[#D9381E] text-white text-base font-black border-2 border-[#111827] hover:opacity-90 transition">顯示全部單字</button>
      </div>

      <!-- 3D Flashcard -->
      <div id="flashcard-stage" class="perspective-1000">
        <div id="flip-card-inner" class="flip-card-inner cursor-pointer select-none" role="button" tabindex="0">
          <!-- FRONT -->
          <div class="flip-card-face bg-white rounded-3xl border-4 border-[#111827] p-6 sm:p-10 flex flex-col justify-between shadow-sm">
            <div class="flex items-center justify-between">
              <span id="card-type-badge" class="px-4 py-1.5 rounded-xl text-base font-black bg-[#FEE2E2] text-[#B91C1C] border-2 border-[#111827]">い形容詞</span>
              <span id="card-status-badge" class="text-sm font-black text-gray-500">尚未標記</span>
            </div>

            <div class="my-8 text-center space-y-6">
              <div id="card-front-word" class="jp-text text-5xl sm:text-7xl font-black text-[#111827] tracking-wide">
                <ruby>大<rt>おお</rt></ruby>きい
              </div>
              <div>
                <button id="speak-word-btn" type="button" class="inline-flex items-center gap-2.5 h-14 px-7 rounded-2xl bg-[#2563EB] text-white text-xl font-black border-4 border-[#111827] hover:bg-[#1D4ED8] active:scale-95 transition shadow-sm">
                  🔊 聽單字發音
                </button>
              </div>
            </div>

            <div class="text-center text-base font-bold text-gray-500">
              點擊卡片查看中文意思與否定變化 ↻
            </div>
          </div>

          <!-- BACK -->
          <div class="flip-card-face flip-card-back bg-[#FFFBEB] rounded-3xl border-4 border-[#111827] p-6 sm:p-10 flex flex-col justify-between shadow-sm">
            <div class="flex items-center justify-between">
              <span class="px-4 py-1.5 rounded-xl text-base font-black bg-[#111827] text-white">中文與否定變化</span>
              <span id="card-back-kana" class="jp-text text-lg font-black text-gray-700">おおきい</span>
            </div>

            <div class="my-6 space-y-5 text-center">
              <div id="card-back-meaning" class="text-4xl sm:text-5xl font-black text-[#111827]">
                大的
              </div>

              <div class="bg-white rounded-2xl border-2 border-[#111827] p-4 max-w-xl mx-auto space-y-2">
                <div class="text-sm font-black text-gray-500">現在否定形（不～）</div>
                <div class="flex items-center justify-center gap-3 flex-wrap">
                  <span id="card-back-neg" class="jp-text text-2xl sm:text-3xl font-black text-[#D9381E]">大きくないです</span>
                  <button id="speak-neg-btn" type="button" class="h-11 px-4 rounded-xl bg-[#D9381E] text-white text-base font-black border-2 border-[#111827] hover:opacity-90 transition">
                    🔊 否定發音
                  </button>
                </div>
              </div>

              <div class="bg-white rounded-2xl border-2 border-[#111827] p-4 max-w-2xl mx-auto space-y-1.5">
                <div class="flex items-center justify-center gap-3 flex-wrap">
                  <span id="card-back-ex" class="jp-text text-xl sm:text-2xl font-black text-[#111827]">この部屋は大きいです。</span>
