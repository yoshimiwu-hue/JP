<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第三課形容詞｜初級日語單字與否定變化練習卡</title>
  <script src="https://tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://googleapis.com" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans TC', 'Noto Sans JP', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #ffffff;
      color: #111827;
    }
    .jp-text {
      font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
    }
    .mincho-title {
      font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
    }
    .paper-card {
      background-color: #ffffff;
      border-color: #111827;
    }
    /* 3D Flip Card (Grid-stacked so faces never overflow or overlap) */
    .perspective-1000 {
      perspective: 1200px;
    }
    .flip-card-inner {
      display: grid;
      position: relative;
      width: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .cq-container {
      container-type: inline-size;
    }
    .flip-card-face {
      grid-area: 1 / 1;
      width: 100%;
      min-height: 360px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      container-type: inline-size;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
    .hide-furigana rt {
      opacity: 0;
      visibility: hidden;
    }
    ruby rt {
      font-size: 0.52em;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
