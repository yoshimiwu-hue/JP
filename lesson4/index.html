<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日文單字與形容詞・形容動詞自修互動網</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans JP & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', '"Noto Sans JP"', 'sans-serif'],
            jp: ['"Noto Sans JP"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            mist: '#F8FAFC',
            indigoBrand: '#2B5B84',
            tealBrand: '#3A7D7C',
          },
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #F8FAFC;
      color: #1E293B;
      -webkit-tap-highlight-color: transparent;
    }

    /* 3D 翻轉卡片專用樣式 */
    .perspective-1000 {
      perspective: 1200px;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .flashcard-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flashcard-back {
      transform: rotateY(180deg);
    }

    /* 隱藏橫向捲軸但保留滑動功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 聲波脈衝動畫（播放語音時啟動） */
    @keyframes pulseRing {
      0% { transform: scale(0.96); opacity: 0.85; }
      70% { transform: scale(1.12); opacity: 0; }
      100% { transform: scale(0.96); opacity: 0; }
    }
    .is-speaking {
      position: relative;
      box-shadow: 0 0 0 3px rgba(58, 125, 124, 0.35);
    }
    .is-speaking::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      border: 2px solid #3A7D7C;
      animation: pulseRing 1.1s infinite;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigoBrand/15">

  <!-- 頂部導覽與語音設定列 -->
  <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3.5">
      <!-- 標題區 -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-indigoBrand text-white flex items-center justify-center font-jp font-bold text-2xl shadow-sm">
            あ
          </div>
          <h1 class="text-xl sm:text-2xl md:text-[26px] font-bold text-slate-800 tracking-tight leading-snug">
            日文單字與形容詞・形容動詞（な形容詞）自修網
          </h1>
        </div>

        <!-- 手機版模式切換按鈕 -->
        <div class="flex md:hidden items-center gap-2">
          <button
            id="mobileModeListBtn"
            type="button"
            class="px-4 py-2.5 rounded-xl bg-indigoBrand text-white text-base sm:text-lg font-bold transition"
          >
            📋 對照表
          </button>
          <button
            id="mobileModeCardBtn"
            type="button"
            class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-base sm:text-lg font-bold transition"
          >
            🗂️ 單字卡
          </button>
          <button
            id="mobileModeQuizBtn"
            type="button"
            class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-base sm:text-lg font-bold transition"
          >
            🎧 聽力測驗
          </button>
        </div>
      </div>

      <!-- 語音控制與檢視模式切換 -->
      <div class="flex flex-wrap items-center gap-3 sm:gap-4">
        <!-- 語速切換 -->
        <div class="inline-flex rounded-xl bg-slate-100 p-1.5 text-lg sm:text-xl font-bold" role="group" aria-label="語速控制">
          <button
            id="speedNormalBtn"
            type="button"
            class="px-4 py-2 rounded-lg bg-white text-indigoBrand shadow-sm transition font-bold"
          >
            正常
          </button>
          <button
            id="speedSlowBtn"
            type="button"
            class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition font-bold"
          >
            慢速
          </button>
        </div>

        <!-- 自動發音開關 -->
        <label class="inline-flex items-center gap-2.5 px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200/70 cursor-pointer text-lg sm:text-xl font-bold text-slate-700 transition select-none">
          <input id="autoPlayCheckbox" type="checkbox" class="rounded text-tealBrand focus:ring-tealBrand w-5 h-5" />
          <span>自動發音</span>
        </label>

        <!-- 桌面版模式切換（對照表 / 單字卡 / 聽力測驗） -->
        <div class="hidden md:inline-flex rounded-xl bg-slate-100 p-1.5 text-lg sm:text-xl font-bold">
          <button
            id="modeListBtn"
            type="button"
            class="px-5 py-2.5 rounded-lg bg-indigoBrand text-white shadow-sm transition font-bold"
          >
            📋 對照表
          </button>
          <button
            id="modeCardBtn"
            type="button"
            class="px-5 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition font-bold"
          >
            🗂️ 單字卡
          </button>
          <button
            id="modeQuizBtn"
            type="button"
            class="px-5 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition font-bold"
          >
            🎧 聽力測驗
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 flex flex-col gap-6">

    <!-- 文法分類篩選標籤與熟練度進度條 -->
    <section class="flex flex-col gap-3.5">
      <!-- 分類 Tabs -->
      <div id="categoryTabs" class="flex items-center gap-2.5 overflow-x-auto no-scrollbar pb-1">
        <!-- 由 JS 動態渲染分類按鈕 -->
      </div>

      <!-- 學習進度條與篩選開關 -->
      <div class="bg-white rounded-2xl px-5 py-4 border border-slate-200/80 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3.5">
        <div class="flex items-center gap-3.5 flex-1">
          <span class="text-lg font-bold text-slate-700 whitespace-nowrap">
            熟練進度
          </span>
          <div class="flex-1 max-w-xs h-3.5 bg-slate-100 rounded-full overflow-hidden">
            <div id="masteredProgressBar" class="h-full bg-tealBrand transition-all duration-300 rounded-full" style="width: 0%"></div>
          </div>
          <span id="masteredStatsText" class="text-lg font-bold text-tealBrand whitespace-nowrap">
            0 / 56
          </span>
        </div>

        <div class="flex items-center gap-3 self-end sm:self-auto">
          <button
            id="filterReviewOnlyBtn"
            type="button"
            class="px-5 py-2.5 rounded-xl text-lg font-bold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition flex items-center gap-2"
          >
            <span id="filterReviewDot" class="w-3.5 h-3.5 rounded-full bg-amber-400"></span>
            <span id="filterReviewText">只看未熟練</span>
          </button>
          <button
            id="resetProgressBtn"
            type="button"
            class="px-4 py-2.5 rounded-xl text-lg font-bold text-slate-500 hover:text-rose-600 hover:bg-rose-50 transition"
          >
            重設
          </button>
        </div>
      </div>
    </section>

    <!-- 狀態通知條（無 alert） -->
    <div id="toastBanner" class="hidden rounded-xl bg-indigoBrand text-white text-base sm:text-lg px-5 py-3.5 shadow-md flex items-center justify-between">
      <span id="toastMessage"></span>
      <button id="toastCloseBtn" type="button" class="text-white/80 hover:text-white ml-3 font-bold text-lg">✕</button>
    </div>

    <!-- ==================== 視圖一：3D 互動單字卡模式 ==================== -->
    <section id="flashcardView" class="hidden flex-1 flex-col items-center justify-center gap-6">
      <!-- 卡片上方資訊列 -->
      <div class="w-full max-w-2xl flex items-center justify-between px-1">
        <div class="flex items-center gap-2.5">
          <span id="cardIndexBadge" class="px-4 py-1.5 rounded-full bg-indigoBrand/10 text-indigoBrand text-base sm:text-lg font-bold">
            1 / 56
          </span>
          <span id="cardCategoryBadge" class="px-4 py-1.5 rounded-full bg-slate-200/70 text-slate-700 text-base font-semibold">
            名詞單字
          </span>
        </div>

        <button
          id="shuffleBtn"
          type="button"
          class="px-5 py-2.5 rounded-xl bg-white border border-slate-200 hover:border-indigoBrand/40 hover:text-indigoBrand text-slate-700 text-lg font-bold shadow-sm transition flex items-center gap-2"
        >
          <span>🔀</span>
          <span>隨機洗牌</span>
        </button>
      </div>

      <!-- 3D 翻轉卡片容器 -->
      <div class="w-full max-w-2xl h-[400px] sm:h-[440px] perspective-1000">
        <div id="flashcardInner" class="flashcard-inner cursor-pointer select-none" role="button" tabindex="0" aria-label="單字卡">
          
          <!-- 卡片正面：分類標籤 + 日文漢字 + 假名讀音 + 發音按鈕 -->
          <div class="flashcard-face bg-white rounded-3xl border border-slate-200/90 shadow-lg p-6 sm:p-9 flex flex-col justify-between">
            <!-- 正面頂部 -->
            <div class="flex items-center justify-between">
              <span id="frontTopCategory" class="px-4 py-1.5 rounded-full bg-indigoBrand/10 text-indigoBrand text-base font-bold">
                形容動詞（な形容詞）・基本型
              </span>
              <span id="frontMasteredBadge" class="hidden px-3.5 py-1.5 rounded-full bg-tealBrand/10 text-tealBrand text-base font-bold">
                ✓ 已熟練
              </span>
            </div>

            <!-- 正面核心日文與假名 -->
            <div class="my-auto text-center flex flex-col items-center justify-center gap-2.5 px-2 w-full">
              <div id="cardFrontMain" class="font-jp text-3xl sm:text-4xl font-bold text-slate-800 tracking-wide leading-snug">
                静かです
              </div>
              <div id="cardFrontReading" class="font-jp text-lg sm:text-xl font-medium text-indigoBrand tracking-wider">
                しずかです
              </div>
              <!-- 肯定與否定合併顯示時的否定句區 -->
              <div id="cardFrontNegBox" class="hidden w-full max-w-lg pt-3 mt-1 border-t border-slate-200/80 flex flex-col items-center gap-1">
                <div id="cardFrontNegMain" class="font-jp text-2xl sm:text-3xl font-bold text-rose-700 tracking-wide leading-snug">
                  静かではありません
                </div>
                <div id="cardFrontNegReading" class="font-jp text-base sm:text-lg font-medium text-rose-500 tracking-wider">
                  しずかでは ありません
                </div>
              </div>
            </div>

            <!-- 正面底部：獨立發音按鈕 -->
            <div id="frontAudioBtnsRow" class="flex flex-wrap items-center justify-center gap-3.5 pt-4 border-t border-slate-100">
              <button
                id="speakFrontBtn"
                type="button"
                class="flex-1 sm:flex-initial px-8 py-4 rounded-2xl bg-tealBrand hover:bg-tealBrand/90 active:scale-[0.98] text-white font-bold text-xl sm:text-2xl shadow-sm transition flex items-center justify-center gap-2"
              >
                <span id="speakFrontBtnLabel">🔊 發音</span>
              </button>
              <button
                id="speakFrontNegBtn"
                type="button"
                class="hidden flex-1 sm:flex-initial px-8 py-4 rounded-2xl bg-rose-600 hover:bg-rose-700 active:scale-[0.98] text-white font-bold text-xl sm:text-2xl shadow-sm transition flex items-center justify-center gap-2"
              >
                <span>🔊 否定發音</span>
              </button>
            </div>
          </div>

          <!-- 卡片反面：中文意思 + 簡短文法重點標註 + 發音按鈕 -->
          <div class="flashcard-face flashcard-back bg-white rounded-3xl border-2 border-indigoBrand/20 shadow-lg p-6 sm:p-9 flex flex-col justify-between">
            <!-- 反面頂部 -->
            <div class="flex items-center justify-between">
              <span class="text-base font-bold text-slate-400 tracking-wider">
                中文意思
              </span>
              <span id="backGrammarTag" class="px-4 py-1.5 rounded-full bg-amber-100/80 text-amber-800 text-base font-bold">
                名詞
              </span>
            </div>

            <!-- 反面核心中文與文法重點 -->
            <div class="my-auto text-center flex flex-col items-center justify-center gap-3 px-2">
              <div id="cardBackMeaning" class="text-2xl sm:text-3xl font-bold text-slate-800 leading-snug">
                芒果刨冰
              </div>
              <div class="font-jp text-base sm:text-lg text-slate-600 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200/70">
                <span id="cardBackRefJp">マンゴーかき氷（マンゴーかきごおり）</span>
              </div>
              <div id="cardBackNote" class="text-sm sm:text-base font-medium text-indigoBrand bg-indigoBrand/5 border border-indigoBrand/15 rounded-xl px-4 py-2.5">
                台灣代表性甜點
              </div>
            </div>

            <!-- 反面底部：獨立發音按鈕 -->
            <div class="flex flex-wrap items-center justify-center gap-3.5 pt-4 border-t border-slate-100">
              <button
                id="speakBackBtn"
                type="button"
                class="flex-1 sm:flex-initial px-8 py-4 rounded-2xl bg-tealBrand hover:bg-tealBrand/90 active:scale-[0.98] text-white font-bold text-xl sm:text-2xl shadow-sm transition flex items-center justify-center gap-2"
              >
                <span id="speakBackBtnLabel">🔊 發音</span>
              </button>
              <button
                id="speakBackNegBtn"
                type="button"
                class="hidden flex-1 sm:flex-initial px-8 py-4 rounded-2xl bg-rose-600 hover:bg-rose-700 active:scale-[0.98] text-white font-bold text-xl sm:text-2xl shadow-sm transition flex items-center justify-center gap-2"
              >
                <span>🔊 否定發音</span>
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- 卡片下方控制按鈕列：上一張 / 標記已熟練 / 下一張 -->
      <div class="w-full max-w-2xl grid grid-cols-3 gap-3.5">
        <button
          id="prevCardBtn"
          type="button"
          class="py-4 px-4 rounded-2xl bg-white hover:bg-slate-50 active:scale-[0.98] border border-slate-200 text-slate-700 font-bold text-xl shadow-sm transition flex items-center justify-center gap-1.5"
        >
          <span>←</span>
          <span>上一張</span>
        </button>

        <button
          id="toggleMasteredBtn"
          type="button"
          class="py-4 px-4 rounded-2xl bg-white hover:bg-tealBrand/5 active:scale-[0.98] border border-slate-200 text-slate-700 font-bold text-xl shadow-sm transition flex items-center justify-center gap-1.5"
        >
          <span id="masteredBtnIcon">☆</span>
          <span id="masteredBtnText">標記已熟練</span>
        </button>

        <button
          id="nextCardBtn"
          type="button"
          class="py-4 px-4 rounded-2xl bg-indigoBrand hover:bg-indigoBrand/90 active:scale-[0.98] text-white font-bold text-xl shadow-sm transition flex items-center justify-center gap-1.5"
        >
          <span>下一張</span>
          <span>→</span>
        </button>
      </div>
    </section>

    <!-- ==================== 視圖二：直接對照表模式（預設開啟，免翻卡） ==================== -->
    <section id="listView" class="flex flex-col gap-4">
      <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="px-6 py-4.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/60">
          <h2 id="listViewTitle" class="text-xl sm:text-2xl font-bold text-slate-800">形容動詞（な形容詞）・肯定與否定對照練習</h2>
          <span id="listCountLabel" class="text-base font-bold text-indigoBrand bg-indigoBrand/10 px-4 py-1.5 rounded-full">
            15 筆
          </span>
        </div>

        <div id="studyListContainer" class="divide-y divide-slate-100">
          <!-- 由 JS 動態生成直接對照練習卡片列（無需翻卡） -->
        </div>
      </div>
    </section>

    <!-- ==================== 視圖三：🎧 日語聽力測驗模式 ==================== -->
    <section id="quizView" class="hidden flex-col gap-5">
      <div class="bg-white rounded-3xl border border-slate-200/90 shadow-lg p-6 sm:p-9 flex flex-col gap-6 max-w-3xl w-full mx-auto">
        <!-- 測驗頂部狀態列 -->
        <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-100">
          <div class="flex items-center gap-3">
            <span id="quizProgressBadge" class="px-4 py-1.5 rounded-full bg-indigoBrand/10 text-indigoBrand text-base sm:text-lg font-bold">
              第 1 / 10 題
            </span>
            <span id="quizScoreBadge" class="px-4 py-1.5 rounded-full bg-tealBrand/10 text-tealBrand text-base sm:text-lg font-bold">
              答對：0 題
            </span>
          </div>

          <div class="flex items-center gap-2">
            <button
              id="restartQuizBtn"
              type="button"
              class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-lg font-bold transition"
            >
              🔄 重新出題
            </button>
          </div>
        </div>

        <!-- 進行中題目區 -->
        <div id="quizActiveArea" class="flex flex-col gap-6">
          <!-- 播放語音按鈕區 -->
          <div class="rounded-2xl bg-slate-50 border border-slate-200/80 p-6 sm:p-8 flex flex-col items-center justify-center gap-3.5 text-center">
            <span id="quizCategoryHint" class="px-3.5 py-1 rounded-full bg-indigoBrand/10 text-indigoBrand text-sm sm:text-base font-bold">
              形容動詞（な形容詞）・肯定與否定
            </span>
            <button
              id="quizPlayAudioBtn"
              type="button"
              class="mt-1 px-10 py-5 rounded-2xl bg-tealBrand hover:bg-tealBrand/90 active:scale-95 text-white font-bold text-2xl sm:text-3xl shadow-md transition flex items-center gap-3"
            >
              <span>🔊 播放題目發音</span>
            </button>
          </div>

          <!-- 4 個選擇題選項 -->
          <div id="quizOptionsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- 由 JS 動態產生選項按鈕 -->
          </div>

          <!-- 作答後的即時解答揭曉區 -->
          <div id="quizFeedbackBox" class="hidden rounded-2xl p-5 sm:p-6 border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex flex-col gap-1">
              <div id="quizFeedbackTitle" class="text-lg sm:text-xl font-bold"></div>
              <div id="quizFeedbackDetail" class="font-jp text-xl sm:text-2xl font-bold text-slate-800"></div>
              <div id="quizFeedbackSub" class="text-base text-slate-600"></div>
            </div>
            <button
              id="quizNextBtn"
              type="button"
              class="shrink-0 px-8 py-4 rounded-xl bg-indigoBrand hover:bg-indigoBrand/90 active:scale-95 text-white font-bold text-xl shadow-sm transition"
            >
              下一題 →
            </button>
          </div>
        </div>

        <!-- 測驗結算畫面 -->
        <div id="quizResultArea" class="hidden py-6 flex-col items-center text-center gap-5">
          <div class="w-16 h-16 rounded-2xl bg-tealBrand/15 text-tealBrand flex items-center justify-center text-3xl font-bold">
            🏆
          </div>
          <div class="flex flex-col gap-1">
            <h3 class="text-2xl font-bold text-slate-800">聽力測驗完成</h3>
            <p id="quizFinalScoreText" class="text-xl font-bold text-tealBrand mt-1">
              得分：10 / 10 題（100%）
            </p>
          </div>

          <!-- 錯題回顧列表 -->
          <div id="quizWrongListContainer" class="w-full text-left flex flex-col gap-3 mt-2"></div>

          <button
            id="quizPlayAgainBtn"
            type="button"
            class="mt-2 px-10 py-4.5 rounded-2xl bg-indigoBrand hover:bg-indigoBrand/90 active:scale-95 text-white font-bold text-xl sm:text-2xl shadow-md transition"
          >
            🔄 再測驗一次
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- 極簡頁尾 -->
  <footer class="py-5 text-center text-base text-slate-400 border-t border-slate-200/60 bg-white/60 mt-6">
    日文單字與形容詞・形容動詞（な形容詞）自修網
  </footer>

  <script>
    /**
     * 精選單字與形容詞・形容動詞（な形容詞）資料
     * - 「形容動詞（な形容詞）・肯定與否定」將同一個單字的「現在肯定（〜です）」與「現在否定（〜ではありません）」合併在同一項目中，免翻卡即可同時對照與各自點擊發音

    /* =====================================================================
     * 智慧自然日語語音引擎（排除機械音 + 雙層備援音訊流）
     * ===================================================================== */
    let activeUtterances = [];
    let currentFallbackAudio = null;
    let currentSpeakingBtn = null;

    function unlockAudioContext() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
        }
      } catch (e) {}
    }

    function setSpeakingVisual(btn, isSpeaking) {
      if (currentSpeakingBtn && currentSpeakingBtn !== btn) {
        currentSpeakingBtn.classList.remove('is-speaking');
      }
      if (!btn) return;
      if (isSpeaking) {
        btn.classList.add('is-speaking');
        currentSpeakingBtn = btn;
      } else {
        btn.classList.remove('is-speaking');
        if (currentSpeakingBtn === btn) {
          currentSpeakingBtn = null;
        }
      }
    }

    function stopAllAudio() {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      } catch (e) {}

      if (currentFallbackAudio) {
        try {
          currentFallbackAudio.pause();
          currentFallbackAudio.src = '';
        } catch (e) {}
        currentFallbackAudio = null;
      }

      if (currentSpeakingBtn) {
        setSpeakingVisual(currentSpeakingBtn, false);
      }
    }

    /**
     * 評分並挑選最高自然度的日語語音（優先神經網路／自然女聲，排除低階機械音）
     */
    function selectBestNaturalJapaneseVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const jaVoices = voices.filter(v =>
        (v.lang && v.lang.toLowerCase().startsWith('ja')) ||
        /japanese|日本語/i.test(v.name)
      );

      if (jaVoices.length === 0) {
        state.jaVoice = null;
        state.jaVoiceScore = 0;
        return null;
      }

      let bestVoice = null;
      let bestScore = -1;

      jaVoices.forEach(voice => {
        const name = voice.name || '';
        let score = 10;

        if (/espeak|festival|flite|mbrola/i.test(name)) {
          score -= 50;
        }
        if (/natural|neural|online/i.test(name)) score += 45;
        if (/google\s*日本語/i.test(name)) score += 40;
        if (/nanami|ayumi|haruka|kyoko|otoya|sayaka|shiori/i.test(name)) score += 35;
        if (!voice.localService) score += 10;

        if (score > bestScore) {
          bestScore = score;
          bestVoice = voice;
        }
      });

      if (bestScore < 20) {
        state.jaVoice = null;
        state.jaVoiceScore = 0;
        return null;
      }

      state.jaVoice = bestVoice;
      state.jaVoiceScore = bestScore;
      return bestVoice;
    }

    if ('speechSynthesis' in window) {
      selectBestNaturalJapaneseVoice();
      window.speechSynthesis.onvoiceschanged = selectBestNaturalJapaneseVoice;
    }

    function playFallbackAudio(cleanText, mode, btnElement) {
      const encoded = encodeURIComponent(cleanText);
      const speedParam = mode === 'slow' ? '0.65' : '1';
      const urls = [
        `https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&ttsspeed=${speedParam}&q=${encoded}`,
        `https://dict.youdao.com/dictvoice?audio=${encoded}&le=jap`
      ];

      let urlIdx = 0;
      const tryNextUrl = () => {
        if (urlIdx >= urls.length) {
          setSpeakingVisual(btnElement, false);
          return;
        }
        const audio = new Audio(urls[urlIdx]);
        urlIdx += 1;
        currentFallbackAudio = audio;
        audio.playbackRate = mode === 'slow' ? 0.85 : 1.0;

        audio.onended = () => setSpeakingVisual(btnElement, false);
        audio.onerror = () => tryNextUrl();
        audio.play().catch(() => tryNextUrl());
      };

      tryNextUrl();
    }

    function speakJapanese(rawText, mode = state.speechMode, btnElement = null) {
      if (!rawText) return;
      unlockAudioContext();
      stopAllAudio();

      const cleanText = String(rawText)
        .replace(/[（(][^）)]*[）)]/g, '')
        .trim();
      if (!cleanText) return;

      setSpeakingVisual(btnElement, true);

      const voice = state.jaVoice || selectBestNaturalJapaneseVoice();
      if (!voice || !('speechSynthesis' in window)) {
        playFallbackAudio(cleanText, mode, btnElement);
        return;
      }

      let started = false;
      let fallbackTriggered = false;

      const triggerFallback = () => {
        if (fallbackTriggered) return;
        fallbackTriggered = true;
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
        playFallbackAudio(cleanText, mode, btnElement);
      };

      const guardTimer = setTimeout(() => {
        if (!started) {
          triggerFallback();
        }
      }, 380);

      try {
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.voice = voice;
        utterance.lang = 'ja-JP';
        utterance.rate = mode === 'slow' ? 0.72 : 0.95;
        utterance.pitch = 1.03;

        activeUtterances.push(utterance);

        utterance.onstart = () => {
          started = true;
          clearTimeout(guardTimer);
        };

        utterance.onend = () => {
          clearTimeout(guardTimer);
          activeUtterances = activeUtterances.filter(u => u !== utterance);
          if (!fallbackTriggered) {
            setSpeakingVisual(btnElement, false);
          }
        };

        utterance.onerror = () => {
          clearTimeout(guardTimer);
          activeUtterances = activeUtterances.filter(u => u !== utterance);
          if (!started) {
            triggerFallback();
          } else {
            setSpeakingVisual(btnElement, false);
          }
        };

        window.speechSynthesis.speak(utterance);
      } catch (e) {
        clearTimeout(guardTimer);
        triggerFallback();
      }
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /* =====================================================================
     * 視圖三：🎧 日語聽力測驗模式（聽日語選正確中文理解）
     * ===================================================================== */
    function expandCardsToQuizPool(cards) {
      const pool = [];
      cards.forEach(item => {
        if (item.isPair) {
          const parts = item.meaning.split('／').map(s => s.trim());
          const posMeaning = parts[0] || item.meaning;
          const negMeaning = parts[1] || `不是${posMeaning}`;

          pool.push({
            uid: `${item.id}_pos`,
            category: item.category,
            jpMain: item.frontMain,
            jpReading: item.frontReading,
            speechText: item.speechText,
            meaning: posMeaning,
            grammarNote: '現在肯定（〜です）'
          });
          pool.push({
            uid: `${item.id}_neg`,
            category: item.category,
            jpMain: item.negMain,
            jpReading: item.negReading,
            speechText: item.negSpeechText,
            meaning: negMeaning,
            grammarNote: '現在否定（〜ではありません）'
          });
        } else {
          pool.push({
            uid: `${item.id}_single`,
            category: item.category,
            jpMain: item.frontMain,
            jpReading: item.frontReading,
            speechText: item.speechText,
            meaning: item.meaning,
            grammarNote: item.grammarTag
          });
        }
      });
      return pool;
    }

    function buildListeningQuiz(autoSpeakFirst = true) {
      const sourceCards = state.filteredCards.length > 0 ? state.filteredCards : STUDY_CARDS;
      const pool = expandCardsToQuizPool(sourceCards);
      const allGlobalPool = expandCardsToQuizPool(STUDY_CARDS);
      const shuffledPool = shuffleArray(pool);
      const selectedTargets = shuffledPool.slice(0, Math.min(10, shuffledPool.length));

      const questions = selectedTargets.map(target => {
        let distractorCandidates = pool.filter(item => item.uid !== target.uid && item.meaning !== target.meaning);
        if (distractorCandidates.length < 3) {
          const extra = allGlobalPool.filter(item => item.uid !== target.uid && item.meaning !== target.meaning);
          distractorCandidates = [...distractorCandidates, ...extra];
        }

        const uniqueDistractors = [];
        const seenLabels = new Set([target.meaning]);
        for (const cand of shuffleArray(distractorCandidates)) {
          if (!seenLabels.has(cand.meaning)) {
            seenLabels.add(cand.meaning);
            uniqueDistractors.push(cand);
          }
          if (uniqueDistractors.length === 3) break;
        }

        const options = shuffleArray([
          { ...target, isCorrect: true },
          ...uniqueDistractors.map(d => ({ ...d, isCorrect: false }))
        ]);

        return {
          target,
          options
        };
      });

      state.quiz.questions = questions;
      state.quiz.currentIndex = 0;
      state.quiz.score = 0;
      state.quiz.answered = false;
      state.quiz.wrongItems = [];

      renderListeningQuiz(autoSpeakFirst);
    }

    function renderListeningQuiz(autoSpeak = false) {
      const { questions, currentIndex, score } = state.quiz;
      const total = questions.length;

      if (total === 0) {
        els.quizProgressBadge.textContent = '0 / 0 題';
        els.quizScoreBadge.textContent = '答對：0 題';
        els.quizActiveArea.classList.remove('hidden');
        els.quizResultArea.classList.add('hidden');
        els.quizOptionsGrid.innerHTML = '<div class="col-span-2 text-center py-8 text-slate-400">目前篩選分類下無可測驗題目</div>';
        return;
      }

      if (currentIndex >= total) {
        els.quizProgressBadge.textContent = `完成 ${total} 題`;
        els.quizScoreBadge.textContent = `答對：${score} 題`;
        els.quizActiveArea.classList.add('hidden');
        els.quizResultArea.classList.remove('hidden');
        els.quizResultArea.classList.add('flex');

        const pct = Math.round((score / total) * 100);
        els.quizFinalScoreText.textContent = `得分：${score} / ${total} 題（${pct}%）`;

        if (state.quiz.wrongItems.length === 0) {
          els.quizWrongListContainer.innerHTML = `
            <div class="rounded-2xl bg-tealBrand/10 border border-tealBrand/30 p-5 text-center text-tealBrand text-lg font-bold">
              全部答對，聽力理解非常棒！
            </div>
          `;
        } else {
          els.quizWrongListContainer.innerHTML = `
            <div class="text-base font-bold text-slate-600 mb-1">錯題重聽複習（${state.quiz.wrongItems.length} 題）：</div>
            ${state.quiz.wrongItems.map(item => `
              <div class="rounded-2xl bg-rose-50/70 border border-rose-200 p-4 flex items-center justify-between gap-3">
                <div>
                  <div class="font-jp text-xl sm:text-2xl font-bold text-slate-800">${item.jpMain}（${item.jpReading}）</div>
                  <div class="text-base sm:text-lg font-semibold text-rose-700">正確意思：${item.meaning}</div>
                </div>
                <button
                  type="button"
                  data-speak="${item.speechText}"
                  class="quiz-review-speak-btn shrink-0 px-5 py-3 rounded-xl bg-tealBrand text-white text-lg font-bold shadow-sm"
                >
                  🔊 重聽
                </button>
              </div>
            `).join('')}
          `;
        }
        return;
      }

      const currentQ = questions[currentIndex];
      state.quiz.answered = false;

      els.quizActiveArea.classList.remove('hidden');
      els.quizResultArea.classList.add('hidden');
      els.quizResultArea.classList.remove('flex');
      els.quizFeedbackBox.classList.add('hidden');

      els.quizProgressBadge.textContent = `第 ${currentIndex + 1} / ${total} 題`;
      els.quizScoreBadge.textContent = `答對：${score} 題`;
      els.quizCategoryHint.textContent = currentQ.target.category;

      els.quizOptionsGrid.innerHTML = '';
      currentQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className =
          'quiz-option-btn p-5 sm:p-6 rounded-2xl border-2 border-slate-200 bg-white hover:border-indigoBrand hover:bg-indigoBrand/[0.03] text-left transition flex items-center gap-4 shadow-sm';

        const letter = ['A', 'B', 'C', 'D'][idx];

        btn.innerHTML = `
          <span class="w-11 h-11 rounded-xl bg-slate-100 text-slate-700 font-bold text-xl flex items-center justify-center shrink-0">
            ${letter}
          </span>
          <div class="flex flex-col">
            <span class="text-xl sm:text-2xl font-bold text-slate-800">
              ${opt.meaning}
            </span>
          </div>
        `;

        btn.addEventListener('click', () => handleQuizAnswer(opt, btn));
        els.quizOptionsGrid.appendChild(btn);
      });

      if (autoSpeak) {
        setTimeout(() => {
          speakJapanese(currentQ.target.speechText, state.speechMode, els.quizPlayAudioBtn);
        }, 120);
      }
    }

    function handleQuizAnswer(selectedOpt, clickedBtn) {
      if (state.quiz.answered) return;
      state.quiz.answered = true;

      const currentQ = state.quiz.questions[state.quiz.currentIndex];
      const isCorrect = selectedOpt.isCorrect;

      if (isCorrect) {
        state.quiz.score += 1;
      } else {
        state.quiz.wrongItems.push(currentQ.target);
      }

      els.quizScoreBadge.textContent = `答對：${state.quiz.score} 題`;

      const optionBtns = els.quizOptionsGrid.querySelectorAll('.quiz-option-btn');
      optionBtns.forEach((btn, idx) => {
        btn.disabled = true;
        const optData = currentQ.options[idx];
        btn.classList.remove('hover:border-indigoBrand', 'hover:bg-indigoBrand/[0.03]');

        if (optData.isCorrect) {
          btn.classList.remove('border-slate-200', 'bg-white');
          btn.classList.add('border-tealBrand', 'bg-tealBrand/10');
        } else if (btn === clickedBtn && !isCorrect) {
          btn.classList.remove('border-slate-200', 'bg-white');
          btn.classList.add('border-rose-500', 'bg-rose-50');
        } else {
          btn.classList.add('opacity-55');
        }
      });

      els.quizFeedbackBox.classList.remove('hidden', 'border-tealBrand/40', 'bg-tealBrand/10', 'border-rose-300', 'bg-rose-50');
      if (isCorrect) {
        els.quizFeedbackBox.classList.add('border-tealBrand/40', 'bg-tealBrand/10');
        els.quizFeedbackTitle.className = 'text-lg sm:text-xl font-bold text-tealBrand';
        els.quizFeedbackTitle.textContent = '✓ 答對了！';
      } else {
        els.quizFeedbackBox.classList.add('border-rose-300', 'bg-rose-50');
        els.quizFeedbackTitle.className = 'text-lg sm:text-xl font-bold text-rose-700';
        els.quizFeedbackTitle.textContent = '✕ 再聽聽看喔！';
      }

      els.quizFeedbackDetail.textContent = `${currentQ.target.jpMain}（${currentQ.target.jpReading}）`;
      els.quizFeedbackSub.textContent = `${currentQ.target.meaning} ｜ ${currentQ.target.grammarNote}`;
      els.quizNextBtn.textContent =
        state.quiz.currentIndex + 1 >= state.quiz.questions.length ? '查看成績 →' : '下一題 →';
    }

    /* =====================================================================
     * 事件綁定
     * ===================================================================== */
    function bindEvents() {
      // 視圖模式切換（桌面與手機）
      els.modeListBtn.addEventListener('click', () => setViewMode('list'));
      els.modeCardBtn.addEventListener('click', () => setViewMode('card'));
      els.modeQuizBtn.addEventListener('click', () => setViewMode('quiz'));
      els.mobileModeListBtn.addEventListener('click', () => setViewMode('list'));
      els.mobileModeCardBtn.addEventListener('click', () => setViewMode('card'));
      els.mobileModeQuizBtn.addEventListener('click', () => setViewMode('quiz'));

      // 語速切換
      els.speedNormalBtn.addEventListener('click', () => setSpeechMode('normal'));
      els.speedSlowBtn.addEventListener('click', () => setSpeechMode('slow'));

      // 自動發音勾選
      els.autoPlayCheckbox.addEventListener('change', (e) => {
        state.autoPlay = e.target.checked;
      });

      // 只看未熟練篩選
      els.filterReviewOnlyBtn.addEventListener('click', () => {
        state.reviewOnly = !state.reviewOnly;
        applyFilters(true);
      });

      // 重設熟練紀錄
      els.resetProgressBtn.addEventListener('click', () => {
        state.masteredIds.clear();
        saveProgress();
        applyFilters(false);
        showToast('已重設全部熟練進度');
      });

      // 單字卡翻轉
      els.flashcardInner.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        if (state.filteredCards.length === 0) return;
        state.isFlipped = !state.isFlipped;
        renderFlashcard();
      });

      // 單字卡正反面發音按鈕
      els.speakFrontBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const card = state.filteredCards[state.currentIndex];
        if (card) speakJapanese(card.speechText, state.speechMode, els.speakFrontBtn);
      });

      els.speakFrontNegBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const card = state.filteredCards[state.currentIndex];
        if (card && card.negSpeechText) speakJapanese(card.negSpeechText, state.speechMode, els.speakFrontNegBtn);
      });

      els.speakBackBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const card = state.filteredCards[state.currentIndex];
        if (card) speakJapanese(card.speechText, state.speechMode, els.speakBackBtn);
      });

      els.speakBackNegBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const card = state.filteredCards[state.currentIndex];
        if (card && card.negSpeechText) speakJapanese(card.negSpeechText, state.speechMode, els.speakBackNegBtn);
      });

      // 上一張 / 下一張 / 洗牌 / 標記已熟練
      els.prevCardBtn.addEventListener('click', () => goToCard(state.currentIndex - 1));
      els.nextCardBtn.addEventListener('click', () => goToCard(state.currentIndex + 1));

      els.shuffleBtn.addEventListener('click', () => {
        if (state.filteredCards.length <= 1) return;
        state.filteredCards = shuffleArray(state.filteredCards);
        state.currentIndex = 0;
        state.isFlipped = false;
        renderFlashcard();
        showToast('已隨機重新排列目前卡片');
      });

      els.toggleMasteredBtn.addEventListener('click', () => {
        const card = state.filteredCards[state.currentIndex];
        if (!card) return;
        if (state.masteredIds.has(card.id)) {
          state.masteredIds.delete(card.id);
        } else {
          state.masteredIds.add(card.id);
        }
        saveProgress();
        if (state.reviewOnly) {
          applyFilters(false);
        } else {
          renderProgressStats();
          renderFlashcard();
          renderListView();
        }
      });

      // 聽力測驗按鈕事件
      els.quizPlayAudioBtn.addEventListener('click', () => {
        const currentQ = state.quiz.questions[state.quiz.currentIndex];
        if (currentQ) {
          speakJapanese(currentQ.target.speechText, state.speechMode, els.quizPlayAudioBtn);
        }
      });

      els.quizNextBtn.addEventListener('click', () => {
        state.quiz.currentIndex += 1;
        renderListeningQuiz(true);
      });

      els.restartQuizBtn.addEventListener('click', () => buildListeningQuiz(true));
      els.quizPlayAgainBtn.addEventListener('click', () => buildListeningQuiz(true));

      els.quizWrongListContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('.quiz-review-speak-btn');
        if (btn) {
          speakJapanese(btn.getAttribute('data-speak'), state.speechMode, btn);
        }
      });

      // 總覽對照表事件委派（發音與熟練切換）
      els.studyListContainer.addEventListener('click', (e) => {
        const speakBtn = e.target.closest('.list-speak-btn');
        if (speakBtn) {
          const text = speakBtn.getAttribute('data-speak');
          speakJapanese(text, state.speechMode, speakBtn);
          return;
        }

        const masteredBtn = e.target.closest('.list-mastered-btn');
        if (masteredBtn) {
          const id = Number(masteredBtn.getAttribute('data-id'));
          if (state.masteredIds.has(id)) {
            state.masteredIds.delete(id);
          } else {
            state.masteredIds.add(id);
          }
          saveProgress();
          if (state.reviewOnly) {
            applyFilters(false);
          } else {
            renderProgressStats();
            renderFlashcard();
            renderListView();
          }
        }
      });

      // 關閉通知條
      els.toastCloseBtn.addEventListener('click', () => {
        els.toastBanner.classList.add('hidden');
      });

      // 鍵盤快捷操作（左右方向鍵切卡、空白鍵翻卡、R 鍵發音）
      document.addEventListener('keydown', (e) => {
        if (state.viewMode !== 'card' || state.filteredCards.length === 0) return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (e.key === 'ArrowRight') {
          e.preventDefault();
          goToCard(state.currentIndex + 1);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          goToCard(state.currentIndex - 1);
        } else if (e.key === ' ') {
          e.preventDefault();
          state.isFlipped = !state.isFlipped;
          renderFlashcard();
        } else if (e.key.toLowerCase() === 'r') {
          e.preventDefault();
          const card = state.filteredCards[state.currentIndex];
          const btn = state.isFlipped ? els.speakBackBtn : els.speakFrontBtn;
          speakJapanese(card.speechText, state.speechMode, btn);
        }
      });

      // 手機左右滑動切換卡片
      let touchStartX = 0;
      els.flashcardInner.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      els.flashcardInner.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diffX) > 55) {
          if (diffX < 0) {
            goToCard(state.currentIndex + 1);
          } else {
            goToCard(state.currentIndex - 1);
          }
        }
      }, { passive: true });
    }

    // 初始化應用程式
    window.addEventListener('DOMContentLoaded', () => {
      loadProgress();
      bindEvents();
      applyFilters(true);
    });
  </script>
