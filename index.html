<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初級日語互動課程目錄</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --text-main: #1A1A1A;
      --text-sub: #4A4A4A;
      --card-3-bg: #FFF5F5;
      --card-3-border: #D9381E;
      --card-3-btn: #D9381E;
      --card-4-bg: #F0F7FF;
      --card-4-border: #0056B3;
      --card-4-btn: #0056B3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Noto Sans TC", "Noto Sans JP", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
      max-width: 800px;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #111111;
    }

    header p {
      font-size: 1.35rem;
      color: var(--text-sub);
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 960px;
    }

    .course-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 20px;
      padding: 36px 32px;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 4px solid transparent;
    }

    .course-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
    }

    /* 第三課：い形容詞（鮮明朱紅高對比） */
    .card-lesson3 {
      background-color: var(--card-3-bg);
      border-color: var(--card-3-border);
    }

    .card-lesson3 .badge {
      background-color: var(--card-3-btn);
    }

    .card-lesson3 .enter-btn {
      background-color: var(--card-3-btn);
    }

    /* 第四課：な形容詞 / 形容動詞（鮮明深藍高對比） */
    .card-lesson4 {
      background-color: var(--card-4-bg);
      border-color: var(--card-4-border);
    }

    .card-lesson4 .badge {
      background-color: var(--card-4-btn);
    }

    .card-lesson4 .enter-btn {
      background-color: var(--card-4-btn);
    }

    .badge {
      display: inline-block;
      color: #FFFFFF;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 50px;
      margin-bottom: 20px;
      align-self: flex-start;
    }

    .course-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .course-desc {
      font-size: 1.25rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .enter-btn {
      display: block;
      width: 100%;
      text-align: center;
      color: #FFFFFF;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 18px 24px;
      border-radius: 14px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 2.1rem;
      }
      .course-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>初級日語互動課程</h1>
    <p>請點擊下方課程卡片進入單元學習與發音練習</p>
  </header>

  <main class="course-grid">
    <!-- 第三課連結卡片 -->
    <a href="lesson3/index.html" class="course-card card-lesson3">
      <div>
        <span class="badge">第 3 課</span>
        <h2 class="course-title">形容詞（い形容詞）</h2>
        <p class="course-desc">學習「い」結尾形容詞的核心單字、語音發音與現在否定變化練習。</p>
      </div>
      <div class="enter-btn">進入第三課 →</div>
    </a>

    <!-- 第四課連結卡片 -->
    <a href="lesson4/index.html" class="course-card card-lesson4">
      <div>
        <span class="badge">第 4 課</span>
        <h2 class="course-title">形容動詞（な形容詞）</h2>
        <p class="course-desc">掌握「な」形容詞的常用詞彙、名詞修飾接續與句型變化互動練習。</p>
      </div>
      <div class="enter-btn">進入第四課 →</div>
    </a>
  </main>

</body>
</html>
