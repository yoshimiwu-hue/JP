<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日語互動課程目錄</title>
  <style>
    body {
      font-family: "Noto Sans TC", "Noto Sans JP", sans-serif;
      background-color: #FFFFFF;
      color: #1A1A1A;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 40px;
      color: #111111;
    }
    .course-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .course-btn {
      display: block;
      background-color: #0056B3;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 26px;
      font-weight: bold;
      padding: 24px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s, transform 0.1s;
    }
    .course-btn:hover {
      background-color: #003D82;
      transform: translateY(-2px);
    }
    .course-desc {
      display: block;
      font-size: 18px;
      font-weight: normal;
      margin-top: 8px;
      color: #E0EFFF;
    }
  </style>
</head>
<body>

  <h1>日語互動課程目錄</h1>

  <div class="course-list">
    <!-- 第三課 -->
    <a href="lesson1.html" class="course-btn">
      第 3 課：形容詞
      <span class="course-desc">點擊進入互動練習與發音</span>
    </a>

    <!-- 第四課 -->
    <a href="lesson2.html" class="course-btn">
      第 4 課：形容動詞
      <span class="course-desc">點擊進入互動練習與發音</span>
    </a>
  </div>

</body>
</html>
